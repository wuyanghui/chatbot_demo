<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Light Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <header class="chat-header">
        <h1>Light Chat</h1>
      </header>
      <section
        class="chat-log"
        aria-live="polite"
        aria-label="Chat transcript"
        role="log"
      ></section>
      <form class="chat-input" novalidate>
        <div class="model-selector" role="group" aria-label="Model selection">
          <span class="model-label">Model</span>
          <div class="model-selector-buttons">
            <button type="button" class="model-button is-selected" data-model="v1">
              V1
            </button>
            <button type="button" class="model-button" data-model="v2">
              V2
            </button>
          </div>
          <input type="hidden" name="model" id="selected-model" value="v1" />
        </div>
        <div class="thread-field">
          <label for="thread-id">Thread ID</label>
          <input
            id="thread-id"
            name="thread_id"
            type="text"
            placeholder="Auto-generate if blank"
            inputmode="text"
            autocomplete="off"
          />
        </div>
        <label class="sr-only" for="message">Your message</label>
        <textarea
          id="message"
          name="message"
          rows="3"
          placeholder="Type your message..."
          required
          aria-required="true"
        ></textarea>
        <div class="chat-actions">
          <span class="status" role="status" aria-live="assertive"></span>
          <button type="submit">Send</button>
        </div>
      </form>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
